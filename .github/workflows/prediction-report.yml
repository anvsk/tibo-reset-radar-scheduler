name: Send Codex reset prediction report

on:
  schedule:
    # GitHub Actions uses UTC: 02:00 / 09:00 = Beijing 10:00 / 17:00.
    - cron: "0 2,9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-reset-prediction-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MONITOR_URL: https://tibo-reset-radar-anvsk.anvskyi.chatgpt.site/api/prediction-report
      MONITOR_KEY: ${{ secrets.MONITOR_KEY }}
      FEISHU_APP_ID: cli_aaad5f72d7f95cb3
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECIPIENTS_JSON: ${{ secrets.FEISHU_RECIPIENTS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send prediction report to Deng Pingan
        run: node .github/scripts/check.mjs
