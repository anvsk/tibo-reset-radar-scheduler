name: Check Codex reset signals

on:
  schedule:
    # Offset from the top of the hour because GitHub documents higher schedule
    # latency around minute 0. The local five-minute task is the primary path.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-reset-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MONITOR_URL: https://tibo-reset-radar-anvsk.anvskyi.chatgpt.site/api/check
      MONITOR_KEY: ${{ secrets.MONITOR_KEY }}
      FEISHU_APP_ID: cli_aaad5f72d7f95cb3
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECIPIENTS_JSON: ${{ secrets.FEISHU_RECIPIENTS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check and deliver new reset signals
        run: node .github/scripts/check.mjs
